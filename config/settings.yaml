# Configuração GLOBAL — WA Status. O que é de cada produto fica em produtos/<id>/produto.yaml.
fuso: America/Sao_Paulo

waha:
  base_url_env: WAHA_BASE_URL        # comum a todos os produtos
  api_key_env: WHATSAPP_API_KEY      # NUNCA logar
  # sessão, engine e número que publica: por produto (env <PREFIXO>_WAHA_SESSION + produto.yaml → waha)
  status_contacts: null              # null = omitir o campo (ver SPEC 9.2)
  timeout_s: 30

aprovacao:
  # aprovador: por produto, env <PREFIXO>_APPROVER_CHAT_ID
  intervalo_envio_s: [20, 45]              # aleatório entre mensagens da prévia
  sem_resposta_publica: true               # NUNCA vale para peça reprovada no filtro
  min_janela_nova_versao_min: 90

# slots (horário + pilar): por produto, em produtos/<id>/produto.yaml
produtos_dir: produtos
produtos_ativos_env: PRODUTOS_ATIVOS   # ex.: meuproduto,outro

jitter_max_min: 7

layouts_por_pilar:
  autoridade: [tipografico_escuro, lista, foto_topo]
  dor:        [tipografico_escuro, tipografico_claro]
  prova:      [foto_topo, lista, tipografico_claro]
  cta:        [cta]

fotos:
  max_por_dia: 1
  reuso_min_dias: 7
  proibir_dias_consecutivos: true

limites:
  kicker: 28
  headline: 70
  corpo: 180
  item: 48
  itens_qtd: 3
  legenda: 300
  cta_texto: 90
  fonte_dc_min_chars: 12
  fontes_dc_qtd: [1, 3]
  # emojis_legenda_max: por produto (produto.yaml)
  similaridade_headline_max: 0.85
  semanas_historico_headline: 4

imagem:
  largura: 1080
  altura: 1920
  jpeg_qualidade: 90
  max_kb: 900
  area_segura: {x0: 72, x1: 1008, y0: 230, y1: 1450}
  fonte_min_px: {headline: 56, corpo: 34}
  contraste_min_texto: 4.5
  contraste_min_logo: 3.0
  foto_escala_max: 1.15

fonte_conteudo: local                # DC, marca e fotos lidos de produtos/<id>/

# Status em vídeo com trilha. POST /api/{s}/status/video (testado com engine NOWEB).
video:
  ativo: true                 # false = volta a publicar JPEG em /status/image
  duracao_s: 15
  fps: 30
  fade_in_s: 1
  fade_out_s: 2
  volume: 0.8
  ffmpeg: "-c:v libx264 -preset medium -tune stillimage -crf 20 -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart"
  max_kb: 2000
  rodizio_musica: "nao repetir a mesma faixa em 2 slots seguidos; só faixas 'aprovado' em config/musicas.json"
